name: CRE release verification

on:
  push:
  pull_request:

# Validation only needs read access to repository contents.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Full pytest executes Node VM component tests; do not rely on runner defaults.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m catalogue_governance --institution uct --release uct-2026-uploaded-baseline --json
